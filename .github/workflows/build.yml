name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NubeFiscal.PdfGenerator.csproj

      - name: Build
        run: dotnet build NubeFiscal.PdfGenerator.csproj --no-restore -c Release

      - name: Pack
        run: dotnet pack NubeFiscal.PdfGenerator.csproj --no-build -c Release
